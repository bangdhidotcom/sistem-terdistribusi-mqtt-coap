<svg width="1600" height="900" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- Headers -->
  <text x="400" y="50" font-family="Segoe UI" font-size="28" font-weight="bold" text-anchor="middle" fill="#000080">Alur MQTT → CoAP</text>
  <text x="1200" y="50" font-family="Segoe UI" font-size="28" font-weight="bold" text-anchor="middle" fill="#008080">Alur CoAP → MQTT</text>

  <!-- Flow 1 -->
  <rect x="50" y="100" width="700" height="750" rx="10" fill="#f8f8ff" stroke="#000080" stroke-width="2" />
  <g font-family="Segoe UI" font-size="20">
    <text x="80" y="150">1. MQTT Publisher: send msg</text>
    <text x="80" y="220">2. MQTT Broker: publish to topic</text>
    <text x="80" y="290">3. Conv Server: conv_recv_ts</text>
    <text x="80" y="360">4. Conv Server: dedup + anti-loop</text>
    <text x="80" y="430">5. Conv Server: POST /target</text>
    <text x="80" y="500">6. Conv Server: conv_send_ts</text>
    <text x="80" y="570">7. CoAP Client: GET /target</text>
    <text x="80" y="640">8. CoAP Client: dst_recv_ts</text>
    <text x="80" y="710">9. Verification: OK (e2e_delay_ms)</text>
  </g>

  <!-- Flow 2 -->
  <rect x="850" y="100" width="700" height="750" rx="10" fill="#f0fafa" stroke="#008080" stroke-width="2" />
  <g font-family="Segoe UI" font-size="20">
    <text x="880" y="150">1. CoAP Client: POST /source (sent_ts)</text>
    <text x="880" y="220">2. CoAP Server: /source queue</text>
    <text x="880" y="290">3. Conv Server: conv_recv_ts (polling)</text>
    <text x="880" y="360">4. Conv Server: dedup + anti-loop</text>
    <text x="880" y="430">5. Conv Server: MQTT Publish</text>
    <text x="880" y="500">6. Conv Server: conv_send_ts</text>
    <text x="880" y="570">7. MQTT Subscriber: receive msg</text>
    <text x="880" y="640">8. MQTT Subscriber: dst_recv_ts</text>
    <text x="880" y="710">9. Verification: OK (e2e_delay_ms)</text>
  </g>

  <!-- Annotations -->
  <rect x="400" y="780" width="800" height="80" rx="10" fill="#fff5e6" stroke="#ff9900" stroke-width="2" />
  <text x="800" y="815" font-family="Segoe UI" font-size="22" font-weight="bold" text-anchor="middle">ID Unik, Timestamp, Payload Identik Utuh</text>
  <text x="800" y="845" font-family="Segoe UI" font-size="20" text-anchor="middle" fill="#555">conversion_delay_ms = conv_send_ts - conv_recv_ts</text>
</svg>