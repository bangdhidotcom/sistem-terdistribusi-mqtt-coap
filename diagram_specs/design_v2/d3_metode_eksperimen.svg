<svg width="1600" height="900" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <text x="800" y="50" font-family="Segoe UI" font-size="36" font-weight="bold" text-anchor="middle">Metode Eksperimen (40 Run)</text>

  <!-- Matriks -->
  <rect x="100" y="100" width="1400" height="300" rx="10" fill="#fdfdfd" stroke="#333" stroke-width="2" />
  <text x="800" y="200" font-family="Segoe UI" font-size="28" text-anchor="middle">2 Arah (M2C, C2M) × 2 Laju (10, 20 msg/s) × 10 Pengulangan × 10 Menit</text>
  <text x="800" y="300" font-family="Segoe UI" font-size="24" text-anchor="middle" fill="#666">Payload Utama: 4.096 byte | Uji Blockwise: 204.800 byte (RFC 7959)</text>

  <!-- Metrik -->
  <g font-family="Segoe UI" font-size="20">
    <rect x="100" y="450" width="650" height="350" rx="10" fill="#f0f8ff" stroke="#000080" stroke-width="2" />
    <text x="425" y="500" font-family="Segoe UI" font-size="28" font-weight="bold" text-anchor="middle" fill="#000080">Metrik Kinerja</text>
    <text x="130" y="550">1. Success Rate (%)</text>
    <text x="130" y="590">2. Loss Rate (%)</text>
    <text x="130" y="630">3. Delay Konversi (p95 ms)</text>
    <text x="130" y="670">4. Delay E2E (p95 ms)</text>
    <text x="130" y="710">5. Utilisasi CPU (%)</text>
    <text x="130" y="750">6. Penggunaan Memori (MB)</text>
  </g>

  <!-- Sampling -->
  <rect x="850" y="450" width="650" height="350" rx="10" fill="#f0fdf4" stroke="#008080" stroke-width="2" />
  <text x="1175" y="500" font-family="Segoe UI" font-size="28" font-weight="bold" text-anchor="middle" fill="#008080">Resource Monitoring</text>
  <path d="M1175 550 L1175 700" stroke="#008080" stroke-width="4" marker-end="url(#arrow)" />
  <text x="1175" y="730" font-family="Segoe UI" font-size="24" text-anchor="middle" font-weight="bold">Sampling tiap 1 detik</text>
  <text x="1175" y="770" font-family="Segoe UI" font-size="20" text-anchor="middle" fill="#555">(CPU &amp; Memori menggunakan psutil)</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#008080" />
    </marker>
  </defs>
</svg>